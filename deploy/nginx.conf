# Soulfables — reverse proxy.
#
# This is the shape BEFORE TLS. The domain is named here so that certbot
# can find the block that serves it:
#     sudo certbot --nginx -d soulfables.co -d www.soulfables.co
# which edits the server's copy in place — adding a 443 listener, the
# certificate paths and a redirect from 80 — and renews it twice a day
# by timer. deploy.sh never touches nginx, so those edits survive every
# deployment; provision.sh re-installs this file only when no
# certificate has been issued yet.
#
# default_server is kept so the bare IP, and anything else pointed here,
# still reaches the House rather than nginx's welcome page.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name soulfables.co www.soulfables.co _;

    # Covers a cover image on its way to Supabase Storage. The default of
    # 1M rejects most photographs, and does it as a bare 413 that looks
    # like the upload feature is broken.
    client_max_body_size 10M;

    # Never advertise the nginx version to the internet.
    server_tokens off;

    # The app sets its own security headers where it needs them; these are
    # the ones that belong to the server rather than the page.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Next's immutable build assets. Hashed filenames, so they can be
    # cached hard — a new build produces new names.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server actions and the companion's replies can take a while;
        # the default 60s read timeout cuts a slow AI response off
        # mid-sentence and shows the reader a 504.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Upgrade, so anything using a socket keeps working.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}